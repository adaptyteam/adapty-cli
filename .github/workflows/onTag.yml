name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validation:
    name: Run tests
    uses: ./.github/workflows/test.yml

  publish:
    runs-on: ubuntu-latest
    needs: validation
    environment: publish
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec oclif manifest
      - run: npm publish --provenance --tag latest --ignore-scripts
      - run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Published ${PACKAGE_NAME}@${PACKAGE_VERSION}"

  notify-apple-ads-cli:
    name: Sync Apple Ads agent docs
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Dispatch released docs
        env:
          ADAPTY_CLI_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          gh api --method POST repos/adaptyteam/apple-ads-cli/dispatches \
            -f event_type=adapty-cli-released \
            -f "client_payload[ref]=${ADAPTY_CLI_REF}"
